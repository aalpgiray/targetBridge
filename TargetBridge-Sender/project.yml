name: TargetBridge
options:
  bundleIdPrefix: com.targetbridge
  deploymentTarget:
    macOS: "14.0"

targets:
  TBDisplaySender:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TBDisplaySender
        excludes:
          - "**/*.md"
      - path: TBDisplayShared
        excludes:
          - "**/*.md"
      - path: ../TargetBridge-Shared
        excludes:
          - "**/*.md"
      - path: TargetBridgeSupport/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "TargetBridge"
        PRODUCT_BUNDLE_IDENTIFIER: com.targetbridge.sender
        # CFBundleDisplayName / NSHumanReadableCopyright / NSScreenCaptureUsageDescription now
        # live in TargetBridgeSupport/Info.plist (Xcode drops INFOPLIST_KEY_* usage strings once
        # INFOPLIST_FILE is set; the file is the single source of truth for those + the URL scheme).
        MARKETING_VERSION: "3.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: TargetBridgeSupport/TargetBridge-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        # Base plist merged with the auto-generated keys; declares the targetbridge:// URL scheme.
        INFOPLIST_FILE: TargetBridgeSupport/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Give every build a distinct Mach-O LC_UUID.
        #
        # NECP -- the subsystem behind local network privacy -- identifies a
        # program by its main executable UUID. When that identity goes bad the
        # symptom is total and instant: every dial fails in ~35ms with ENETDOWN
        # ("Network is down") while the link is provably fine. Measured against a
        # freshly signed control bundle using identical NWConnection parameters,
        # to the same address, from the same source IP -- the control connects
        # immediately, the sender cannot. Not the address, not the route, not the
        # receiver: the process identity.
        #
        # The build is otherwise deterministic, so rebuilding unchanged source
        # reproduces the same UUID and the same poisoned identity. That is why
        # "just rebuild it" only worked when a source file happened to change too,
        # and why the fault appeared to return at random.
        #
        # macOS offers no supported way to reset local network privacy (Apple
        # radar 134842755), so a fresh identity per build is the workaround
        # available. It is not a fix for a defect in this app.
        OTHER_LDFLAGS: "-Wl,-random_uuid"
        # Put the code back in the main executable.
        #
        # Xcode's debug-dylib split leaves Contents/MacOS/TargetBridge as a 58KB
        # stub that does nothing but load TargetBridge.debug.dylib. The stub's
        # content never varies, so its LC_UUID came out identical on every build
        # -- a full clean build included, and -random_uuid included, because the
        # link is skipped when none of its inputs changed. NECP keys on the MAIN
        # EXECUTABLE's UUID, so the identity it tracks could never move while the
        # split was on. Measured: with -random_uuid the dylib's UUID changed per
        # build and the stub's did not.
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      # Embeds the Control into Contents/PlugIns -- the same shape Teams ships
      # (TeamsWidgetExtension.appex, NSExtensionPointIdentifier
      # com.apple.widgetkit-extension). Without embedding, the extension builds
      # but macOS never sees it and it never appears in the Controls list.
      - target: TBControls
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Stamp Sender Build Info
        script: |
          set -euo pipefail
          STAMP="$(date +%Y%m%d%H%M%S)"
          cat > "${SRCROOT}/TBDisplaySender/TBDisplaySenderBuildInfo.swift" <<EOI
          enum TBDisplaySenderBuildInfo {
              static let marketingVersion = "3.3.0"
              static let buildNumber = "${STAMP}"
              static let versionDisplay = "\\(marketingVersion) + build \\(buildNumber)"
          }
          EOI

  TBControls:
    type: app-extension
    platform: macOS
    # ControlWidget on macOS is 26.0+, NOT 15.0 -- Controls reached the Mac
    # later than iOS, and the compiler is explicit about it. The app stays at
    # 14.0 and only this target requires 26, so on older systems the Control is
    # simply absent rather than the whole app being unavailable.
    deploymentTarget: "26.0"
    sources:
      - path: TBControls
    settings:
      base:
        PRODUCT_NAME: "TBControls"
        PRODUCT_BUNDLE_IDENTIFIER: com.targetbridge.sender.controls
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "TargetBridge"
        # A real plist: the NSExtension dictionary cannot be expressed with
        # INFOPLIST_KEY_*, and without it macOS does not see a widget extension
        # at all -- it embeds fine and never appears in the Controls list.
        INFOPLIST_FILE: TBControls/Support/Info.plist
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
        # Self-contained, like the app target.
        #
        # Xcode's debug-dylib split leaves the .appex executable a 58KB stub that
        # dlopens TBControls.debug.dylib beside it. pluginkit never registered the
        # extension in that shape -- it embedded and signed cleanly and macOS
        # simply did not see it, so it never reached the Controls list.
        ENABLE_DEBUG_DYLIB: NO

  TBDisplaySenderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TBDisplaySenderTests
    dependencies:
      - target: TBDisplaySender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.targetbridge.sender.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TargetBridge.app/Contents/MacOS/TargetBridge"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TBDisplaySender:
    build:
      targets:
        TBDisplaySender: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TBDisplaySenderTests
